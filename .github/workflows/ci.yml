name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5432/marketing_test
      JWT_SECRET: test-secret
      CREDENTIALS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      WEBHOOK_TOKEN: test-webhook-token
      PUBLIC_BASE_URL: https://engine.test
      INTERNAL_TOKEN: test-internal-token
      MARKETPLACE_SIGNUP_URL: https://marketplace.test/signup

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test ops/claude-runner/test/runner-test.mjs
      - run: npm run e2e

      # The dashboard is a separate app with its own dependencies.
      - run: npm ci
        working-directory: dashboard
      - run: npm run typecheck
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
